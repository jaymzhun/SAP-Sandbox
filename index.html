<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Super Auto Pets Sandbox</title>
<link rel="icon" href="img/pets/Ant.webp">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="rotate"><img src="img/pets/Ant.webp" alt=""><div>Turn your device sideways<br>to play the sandbox</div></div>
<div id="viewport">
  <div id="stage">
    <div id="bg"></div>
    <div id="bg-shade"></div>

    <!-- top bar -->
    <div id="topbar">
      <div class="plaque title"><span>Sandbox</span></div>
      <div class="top-actions">
        <button class="ibtn" id="btn-settings" title="Settings: shop values and background"><img src="img/ui/Star.webp" alt=""><span>Settings</span></button>
        <button class="ibtn" id="btn-share" title="Copy a link to these teams"><img src="img/ui/Merge.webp" alt=""><span>Share</span></button>
        <button class="ibtn" id="btn-help" title="How to use the sandbox and Test Battle"><img src="img/ui/QuestionMark.webp" alt=""><span>How to use</span></button>
      </div>
    </div>

    <!-- team headers -->
    <div class="team-head left" id="head-0">
      <div class="plank-label"><span class="tname" contenteditable="true" spellcheck="false">Team 1</span></div>
      <div class="team-tools">
        <button class="sbtn toy" data-act="toy" data-side="0" title="Choose a toy"><img src="img/toys/Balloon.webp" alt=""><span class="lv"></span></button>
        <button class="sbtn" data-act="random" data-side="0" title="Randomize team"><img src="img/ui/Dice.webp" alt=""></button>
        <button class="sbtn" data-act="clear" data-side="0" title="Clear team"><img src="img/ui/Cross.webp" alt=""></button>
      </div>
    </div>
    <div class="team-head right" id="head-1">
      <div class="team-tools">
        <button class="sbtn" data-act="clear" data-side="1" title="Clear team"><img src="img/ui/Cross.webp" alt=""></button>
        <button class="sbtn" data-act="random" data-side="1" title="Randomize team"><img src="img/ui/Dice.webp" alt=""></button>
        <button class="sbtn toy" data-act="toy" data-side="1" title="Choose a toy"><img src="img/toys/Balloon.webp" alt=""><span class="lv"></span></button>
      </div>
      <div class="plank-label"><span class="tname" contenteditable="true" spellcheck="false">Team 2</span></div>
    </div>

    <!-- arena -->
    <div id="arena"></div>

    <!-- bottom bar (edit) -->
    <div id="bottombar" class="edit-only">
      <button class="obtn ghost" id="btn-swap" title="Swap the two teams"><img src="img/ui/Refresh.webp" alt=""><span>Swap</span></button>
      <button class="obtn big" id="btn-test" title="Play these teams in Super Auto Pets (needs the game bridge)"><img src="img/ui/Swords.webp" alt=""><span>Test Battle</span></button>
    </div>
    <div id="hint" class="edit-only">Click a slot to add a pet · click a pet to edit · drag to reorder</div>

    <!-- modal layer -->
    <div id="modal" hidden>
      <div class="modal-backdrop"></div>
      <div class="panel" id="panel"></div>
    </div>
    <div id="toast" hidden></div>
    <div id="tooltip" hidden></div>
  </div>
</div>
<script src="js/version.js"></script>
<script src="data/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/abilities.js"></script>
<script src="js/order.js"></script>
<!-- the game's pet, perk and ability data (pet cards, team ordering) -->
<script src="js/game/data.js"></script>
<script src="js/game/rng.js"></script>
<script src="js/game/model.js"></script>
<script src="js/game/sim.js"></script>
<script src="js/game/abilities.js"></script>
<script src="js/game/adapter.js"></script>
<script src="js/game/info.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
